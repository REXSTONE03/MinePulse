version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: minepulse_postgres
    restart: always
    environment:
      POSTGRES_DB: minepulse_db
      POSTGRES_USER: minepulse_user
      POSTGRES_PASSWORD: minepulse_password_secure
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minepulse_user -d minepulse_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minepulse_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://minepulse_user:minepulse_password_secure@postgres:5432/minepulse_db
      JWT_SECRET_KEY: change_this_jwt_secret_in_production_environment_32chars
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 60
      CORS_ORIGINS: "http://localhost:3000,http://localhost:80,http://localhost:5173"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: minepulse_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
