apiVersion: apps/v1
kind: Deployment
metadata:
  name: minepulse-frontend
  namespace: minepulse
  labels:
    app: minepulse-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: minepulse-frontend
  template:
    metadata:
      labels:
        app: minepulse-frontend
    spec:
      containers:
        - name: frontend
          image: minepulse-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
