apiVersion: apps/v1
kind: Deployment
metadata:
  name: minepulse-backend
  namespace: minepulse
  labels:
    app: minepulse-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: minepulse-backend
  template:
    metadata:
      labels:
        app: minepulse-backend
    spec:
      containers:
        - name: backend
          image: minepulse-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: minepulse-config
            - secretRef:
                name: minepulse-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
